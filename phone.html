<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>three-vcam · phone</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 24px;
        padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
        box-sizing: border-box;
        background: #0e0e12;
        color: #e6e6f0;
        font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px 16px;
        font-variant-numeric: tabular-nums;
      }
      dt {
        color: #9a9ab0;
      }
      dd {
        margin: 0;
        text-align: right;
      }
      .controls {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      input[type="range"] {
        width: 100%;
        height: 42px;
        margin: 0;
        accent-color: #4f8cff;
      }
      select {
        padding: 14px;
        font: inherit;
        color: #e6e6f0;
        background: #26263a;
        border: 1px solid #3a3a52;
        border-radius: 12px;
      }
      button {
        padding: 18px;
        font: inherit;
        font-weight: 600;
        color: #e6e6f0;
        background: #26263a;
        border: 1px solid #3a3a52;
        border-radius: 12px;
        touch-action: manipulation;
      }
      button#zero {
        background: #2f4a86;
        border-color: #4f8cff;
      }
      button:disabled {
        opacity: 0.4;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>three-vcam controller</h1>
      <dl>
        <dt>Link</dt>
        <dd id="link">connecting…</dd>
        <dt>Sensor</dt>
        <dd id="sensor">not enabled</dd>
        <dt>Sent</dt>
        <dd id="sent">0</dd>
      </dl>
    </div>
    <div class="controls">
      <label for="zoom" style="color: #9a9ab0"
        >Zoom<span id="zoomValue" style="float: right; color: #e6e6f0">35 mm</span></label
      >
      <input type="range" id="zoom" min="0" max="1" step="0.001" value="0.368" />
      <label for="grip" style="color: #9a9ab0">Grip</label>
      <select id="grip">
        <option value="portrait">Portrait — upright</option>
        <option value="landscape-left">Landscape — rotated left</option>
        <option value="landscape-right">Landscape — rotated right</option>
      </select>
      <button id="enable">Enable Motion</button>
      <button id="zero" disabled>Re-zero</button>
    </div>
    <script type="module" src="/src/phone.ts"></script>
  </body>
</html>

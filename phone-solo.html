<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Comfy Three Previs · solo camera</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e0e12;
        overflow: hidden;
        font: 15px/1.4 ui-sans-serif, system-ui, sans-serif;
        color: #e6e6f0;
        -webkit-user-select: none;
        user-select: none;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui {
        position: fixed;
        inset: auto 16px calc(16px + env(safe-area-inset-bottom)) 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #status {
        text-align: center;
        color: #9a9ab0;
        font-variant-numeric: tabular-nums;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      button {
        flex: 1;
        padding: 16px;
        font: inherit;
        font-weight: 600;
        color: #e6e6f0;
        background: #26263a;
        border: 1px solid #3a3a52;
        border-radius: 12px;
        touch-action: manipulation;
      }
      button:disabled {
        opacity: 0.4;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="ui">
      <div id="status">Tap Enable Motion to start</div>
      <div class="row">
        <button id="enable">Enable Motion</button>
        <button id="zero" disabled>Re-zero</button>
      </div>
    </div>
    <script type="module" src="/src/phone-solo.ts"></script>
  </body>
</html>

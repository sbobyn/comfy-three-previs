<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>three-vcam</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e0e12;
        overflow: hidden;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e6e6f0;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        min-width: 240px;
        padding: 14px 16px;
        background: rgba(18, 18, 26, 0.82);
        border: 1px solid #2c2c40;
        border-radius: 10px;
        backdrop-filter: blur(8px);
      }
      #hud h1 {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9a9ab0;
      }
      dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 5px 16px;
        font-variant-numeric: tabular-nums;
      }
      dt {
        color: #9a9ab0;
      }
      dd {
        margin: 0;
        text-align: right;
      }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 8px;
        font: inherit;
        color: #e6e6f0;
        background: #26263a;
        border: 1px solid #3a3a52;
        border-radius: 8px;
      }
      #hint {
        position: fixed;
        bottom: 16px;
        left: 16px;
        color: #6e6e88;
      }
      #hint a {
        color: #4f8cff;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud">
      <h1>vcam link</h1>
      <dl>
        <dt>phone</dt>
        <dd id="link">waiting</dd>
        <dt>rate</dt>
        <dd id="rate">—</dd>
        <dt>latency</dt>
        <dd id="latency">—</dd>
        <dt>jitter</dt>
        <dd id="jitter">—</dd>
        <dt>yaw</dt>
        <dd id="yaw">—</dd>
        <dt>drift</dt>
        <dd id="drift">—</dd>
      </dl>
      <button id="mark">Mark drift baseline</button>
    </div>
    <div id="hint">open <a href="/phone.html">/phone.html</a> on the device · <a href="/phone-solo.html">/phone-solo.html</a> to test sensors alone</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

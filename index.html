<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>three-vcam</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e0e12;
        overflow: hidden;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e6e6f0;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      .panel {
        position: fixed;
        top: 16px;
        padding: 14px 16px;
        background: rgba(18, 18, 26, 0.82);
        border: 1px solid #2c2c40;
        border-radius: 10px;
        backdrop-filter: blur(8px);
      }
      #hud {
        left: 16px;
        min-width: 240px;
      }
      #controls {
        right: 16px;
        width: 260px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9a9ab0;
      }
      h2 {
        margin: 16px 0 8px;
        font-size: 12px;
        font-weight: 600;
        color: #e6e6f0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h2:first-of-type {
        margin-top: 4px;
      }
      dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 5px 16px;
        font-variant-numeric: tabular-nums;
      }
      dt {
        color: #9a9ab0;
      }
      dd {
        margin: 0;
        text-align: right;
      }
      label.slider {
        display: block;
        margin: 9px 0;
        color: #9a9ab0;
      }
      label.slider span {
        float: right;
        color: #e6e6f0;
        font-variant-numeric: tabular-nums;
      }
      input[type="range"] {
        width: 100%;
        margin: 4px 0 0;
        accent-color: #4f8cff;
      }
      input[type="checkbox"] {
        accent-color: #4f8cff;
      }
      button {
        padding: 8px;
        font: inherit;
        color: #e6e6f0;
        background: #26263a;
        border: 1px solid #3a3a52;
        border-radius: 8px;
      }
      button:disabled {
        opacity: 0.4;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .row button {
        flex: 1;
      }
      #hud button {
        width: 100%;
        margin-top: 12px;
      }
      .legend {
        margin-top: 12px;
        color: #6e6e88;
        line-height: 1.7;
      }
      .swatch {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 6px;
        border-radius: 2px;
        vertical-align: baseline;
      }
      #hint {
        position: fixed;
        bottom: 16px;
        left: 16px;
        color: #6e6e88;
      }
      #hint a {
        color: #4f8cff;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div class="panel" id="hud">
      <h1>vcam link</h1>
      <dl>
        <dt>source</dt>
        <dd id="source">live</dd>
        <dt>phone</dt>
        <dd id="link">waiting</dd>
        <dt>rate</dt>
        <dd id="rate">—</dd>
        <dt>latency</dt>
        <dd id="latency">—</dd>
        <dt>jitter</dt>
        <dd id="jitter">—</dd>
        <dt>yaw</dt>
        <dd id="yaw">—</dd>
        <dt>drift</dt>
        <dd id="drift">—</dd>
        <dt>lag</dt>
        <dd id="lag">—</dd>
      </dl>
      <button id="mark">Mark drift baseline</button>
      <div class="legend">
        <div><i class="swatch" style="background: #4f8cff"></i>smoothed</div>
        <div><i class="swatch" style="background: #ff7a45"></i>raw</div>
      </div>
    </div>

    <div class="panel" id="controls">
      <h1>smoothing</h1>

      <h2><input type="checkbox" id="deshake" checked /><label for="deshake">Deshake</label></h2>
      <label class="slider"
        >min cutoff<span id="minCutoffValue">1.20 Hz</span>
        <input type="range" id="minCutoff" min="0.1" max="5" step="0.05" value="1.2" />
      </label>
      <label class="slider"
        >speed coefficient<span id="betaValue">0.050</span>
        <input type="range" id="beta" min="0" max="0.5" step="0.005" value="0.05" />
      </label>

      <h2><input type="checkbox" id="inertia" checked /><label for="inertia">Inertia</label></h2>
      <label class="slider"
        >half-life<span id="halfLifeValue">80 ms</span>
        <input type="range" id="halfLife" min="0.005" max="0.5" step="0.005" value="0.08" />
      </label>

      <h2><input type="checkbox" id="showGhost" checked /><label for="showGhost">Show raw</label></h2>

      <h1 style="margin-top: 18px">take</h1>
      <dl>
        <dt>samples</dt>
        <dd id="takeCount">0</dd>
        <dt>duration</dt>
        <dd id="takeDuration">—</dd>
      </dl>
      <div class="row">
        <button id="record">Record</button>
        <button id="play" disabled>Play</button>
      </div>
      <div class="row">
        <label style="color: #9a9ab0"><input type="checkbox" id="loop" checked /> loop playback</label>
      </div>
    </div>

    <div id="hint">
      open <a href="/phone.html">/phone.html</a> on the device ·
      <a href="/phone-solo.html">/phone-solo.html</a> to test sensors alone
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
